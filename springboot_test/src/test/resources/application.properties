#Deshabilita los logs de spring solo en las pruebas, automaticamente se hace lo que hay en este archivo
# Con este archivo, sumado al logback-test.xml solo loguea las cosas realicionadas a las pruebas
logging.level.org.springframework=debug
logging.level.root=debug
#El banner es cuando aparece en consola el nombre de SPRING en grande
spring.main.banner-mode=OFF
logging.level.org.hibernate.SQL=debug
# Para esta falla al hacer las pruebas: java.lang.IllegalStateException: Failed to load ApplicationContext}
# en relación con esta excepción: Failed to start bean 'documentationPluginsBootstrapper' in spring data rest
spring.mvc.pathmatch.matching-strategy = ANT_PATH_MATCHER

